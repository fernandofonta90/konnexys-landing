<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blinds, demo del piloto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F3EE; --surface:#FFFAF6; --surface-2:#FBEFE7;
  --fg:#121210; --muted:#5A554E; --border:#EADDD2; --border-strong:#9A9088;
  --brand:#E8622F; --accent:#A8421F; --accent-hover:#B5430F; --accent-btn:#CC4A18; --accent-fg:#FFFFFF; --accent-soft:#FCE4D8;
  --coin:#7A4E00; --coin-bg:#FBEBC8;
  --ok:#1B6E47; --ok-bg:#DDF1E6; --warn:#7A4E00; --warn-bg:#FBEBC8;
  --danger:#B3261E; --danger-bg:#FBE4E2;
  --slat:#121210; --overlay:rgba(40,24,14,.5);
  --glow-1:rgba(248,150,110,.55); --glow-2:rgba(250,190,160,.5); --glow-3:rgba(247,214,190,.7);
  --shadow:0 28px 56px -28px rgba(176,80,32,.35),0 2px 6px rgba(120,60,20,.06);
  --glass-a:rgba(255,255,255,.66); --glass-b:rgba(255,255,255,.30); --glass-line:rgba(255,255,255,.85); --glass-hi:rgba(255,255,255,.75); --glass-solid:#FFFAF6;
  --display:"Geist","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Geist","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r-sm:8px; --r-md:10px; --r-lg:16px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#171310; --surface:#231D19; --surface-2:#2C2520;
    --fg:#F3ECE6; --muted:#B8ADA3; --border:#3A302A; --border-strong:#7D7268;
    --brand:#FF8A5C; --accent:#FF9466; --accent-hover:#FFA67F; --accent-btn:#FF9466; --accent-fg:#1A1512; --accent-soft:#40261A;
    --coin:#F2C261; --coin-bg:#3A2E12;
    --ok:#7AD3A4; --ok-bg:#153526; --warn:#F2C261; --warn-bg:#3A2E12;
    --danger:#FF8A80; --danger-bg:#3D1917;
    --slat:#0B0907; --overlay:rgba(0,0,0,.65);
    --glow-1:rgba(232,98,47,.22); --glow-2:rgba(232,98,47,.12); --glow-3:rgba(120,60,30,.18);
    --shadow:0 28px 56px -28px rgba(0,0,0,.6);
    --glass-a:rgba(255,255,255,.11); --glass-b:rgba(255,255,255,.04); --glass-line:rgba(255,255,255,.18); --glass-hi:rgba(255,255,255,.14); --glass-solid:#231D19;
  }
}
:root[data-theme="dark"]{
  --bg:#171310; --surface:#231D19; --surface-2:#2C2520;
    --fg:#F3ECE6; --muted:#B8ADA3; --border:#3A302A; --border-strong:#7D7268;
    --brand:#FF8A5C; --accent:#FF9466; --accent-hover:#FFA67F; --accent-btn:#FF9466; --accent-fg:#1A1512; --accent-soft:#40261A;
    --coin:#F2C261; --coin-bg:#3A2E12;
    --ok:#7AD3A4; --ok-bg:#153526; --warn:#F2C261; --warn-bg:#3A2E12;
    --danger:#FF8A80; --danger-bg:#3D1917;
    --slat:#0B0907; --overlay:rgba(0,0,0,.65);
    --glow-1:rgba(232,98,47,.22); --glow-2:rgba(232,98,47,.12); --glow-3:rgba(120,60,30,.18);
    --shadow:0 28px 56px -28px rgba(0,0,0,.6);
    --glass-a:rgba(255,255,255,.11); --glass-b:rgba(255,255,255,.04); --glass-line:rgba(255,255,255,.18); --glass-hi:rgba(255,255,255,.14); --glass-solid:#231D19;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(60rem 40rem at -5% -10%,var(--glow-1),transparent 60%),radial-gradient(50rem 36rem at 105% 20%,var(--glow-2),transparent 60%),radial-gradient(60rem 40rem at 40% 110%,var(--glow-3),transparent 60%),var(--bg);background-attachment:fixed;color:var(--fg);font:400 16px/1.5 var(--body);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;font-weight:800;letter-spacing:-.03em}
h2,h3{font-weight:600;letter-spacing:-.015em}
h1{font-size:clamp(1.6rem,1.2rem + 1.6vw,2.25rem)}
h2{font-size:1.375rem} h3{font-size:1.0625rem}
p{margin:0} ul{margin:0;padding:0;list-style:none}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.875rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:var(--r-sm)}

/* Barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.top-in{max-width:1120px;margin:0 auto;padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.brand{font-family:var(--display);font-weight:800;letter-spacing:-.03em;font-size:1.375rem;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand-mark{width:28px;height:28px;display:grid;gap:3px;padding:4px 0}
.brand-mark i{display:block;background:var(--brand);border-radius:2px}
.brand-mark i:nth-child(2){width:70%} .brand-mark i:nth-child(3){width:45%}
.roles{display:flex;max-width:100%;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px}
.roles button{min-height:40px;padding:0 12px;flex:1 1 auto;border:0;border-radius:8px;background:transparent;color:var(--muted);font:600 .9375rem var(--body);cursor:pointer}
.roles button:hover{color:var(--fg)}
.roles button[aria-selected="true"]{background:var(--fg);color:var(--surface)}
.wrap{max-width:1120px;margin:0 auto;padding:24px 16px 64px}
.wrap.narrow{max-width:460px}
.subnav{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:24px;overflow-x:auto}
.subnav button{min-height:44px;padding:0 16px;border:0;background:none;color:var(--muted);font:500 .875rem var(--mono);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.subnav button:hover{color:var(--fg)}
.subnav button[aria-current="page"]{color:var(--fg);border-bottom-color:var(--brand)}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:var(--r-md);border:2px solid transparent;font:600 1rem var(--body);letter-spacing:-.01em;cursor:pointer;text-decoration:none;transition:background .15s,transform .1s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent-btn);color:var(--accent-fg)} .btn-primary:hover{background:var(--accent-hover)}
.btn-ghost{background:transparent;color:var(--fg);border-color:var(--fg)} .btn-ghost:hover{background:var(--surface-2)}
.btn-text{background:none;color:var(--accent);padding:0 8px} .btn-text:hover{text-decoration:underline}
.btn-danger{background:transparent;color:var(--danger);border-color:var(--danger)} .btn-danger:hover{background:var(--danger-bg)}
.btn[disabled]{opacity:.6;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:500;border:0;cursor:pointer;font-family:var(--mono);font-size:.875rem}
.pill:hover{filter:brightness(.96)}
.coin{width:14px;height:14px;border-radius:50%;border:3px solid currentColor;display:inline-block}

/* Superficies */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px;box-shadow:var(--shadow)}
.card .card{box-shadow:none}
.head-row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:24px}
.head-row p{max-width:60ch}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
@media (min-width:760px){.grid.c3{grid-template-columns:repeat(3,1fr)}.grid.c2{grid-template-columns:repeat(2,1fr)}.grid.c4{grid-template-columns:repeat(4,1fr)}}
.vac{display:flex;flex-direction:column;gap:12px;text-align:left;width:100%;cursor:pointer;font:inherit;color:inherit}
.vac:hover{border-color:var(--brand)}
.vac-meta{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--muted);font-size:.9375rem}
.vac-foot{display:flex;gap:16px;margin-top:auto;padding-top:12px;border-top:1px solid var(--border);font-size:.9375rem}
.vac-foot b{font:800 1.375rem var(--display);letter-spacing:-.02em;display:block}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:6px;font:500 .78125rem/1.4 var(--mono);background:var(--surface-2);color:var(--fg);border:1px solid var(--border)}
.tag.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.tag.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.tag.accent{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--border-strong);background:transparent;color:var(--fg);font:500 .8125rem var(--mono);cursor:pointer}
.chip:hover{background:var(--surface-2)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--surface);border-color:var(--fg)}

/* Tarjeta de candidato */
.cand{display:grid;gap:16px}
.cand + .cand{margin-top:16px}
.cand-head{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}
.rank{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:500 1rem var(--mono)}
.aff{text-align:right;line-height:1.1}
.aff b{font:800 1.875rem var(--display);letter-spacing:-.03em;display:block}
.aff span{font-family:var(--mono)}
.ident{position:relative;min-height:56px;border-radius:var(--r-sm);overflow:hidden;display:flex;flex-direction:column;justify-content:center;max-width:340px}
.ident .real{padding:4px 0}
.ident .real strong{font-size:1.125rem;display:block;line-height:1.2}
.slats{position:absolute;inset:0;display:grid;grid-template-rows:repeat(4,1fr);gap:3px}
.slats i{background:var(--slat);border-radius:2px;transform-origin:center}
.slats i:nth-child(2){width:82%}.slats i:nth-child(3){width:64%}.slats i:nth-child(4){width:40%}
.slats.opening i{animation:slat .32s cubic-bezier(.4,0,.2,1) forwards}
.slats.opening i:nth-child(2){animation-delay:.05s}.slats.opening i:nth-child(3){animation-delay:.1s}.slats.opening i:nth-child(4){animation-delay:.15s}
@keyframes slat{to{transform:scaleY(0);opacity:0}}
.code{font:400 .8125rem var(--mono);color:var(--muted);margin-top:4px}
.bars{display:grid;gap:8px}
@media (min-width:620px){.bars{grid-template-columns:repeat(2,1fr);gap:8px 24px}}
.bar{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:.875rem}
.meter{grid-column:1/-1;height:6px;border-radius:3px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden}
.meter span{display:block;height:100%;background:var(--brand)}
.actions{display:flex;flex-wrap:wrap;gap:8px;padding-top:16px;border-top:1px solid var(--border)}
.contact{display:grid;gap:4px;background:var(--surface-2);border-radius:var(--r-md);padding:12px 16px;font-size:.9375rem}

/* Tablas */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:.9375rem}
th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
th{font:500 .8125rem var(--mono);color:var(--muted);background:var(--surface-2)} tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.kpi b{font:800 2rem var(--display);letter-spacing:-.03em;display:block;line-height:1.1;margin-top:4px}
.empty{text-align:center;padding:48px 24px;border:1px dashed var(--border-strong);border-radius:var(--r-lg);color:var(--muted)}
.empty h3{color:var(--fg);margin-bottom:8px}
.skel{border-radius:var(--r-lg);height:188px;background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sk 1.2s linear infinite;border:1px solid var(--border)}
.skel + .skel{margin-top:16px}
@keyframes sk{to{background-position:-200% 0}}

/* Formularios y modales */
.field{display:grid;gap:6px;margin-bottom:16px}
.field label,.field legend{font-weight:700;padding:0}
.field input,.field select,.field textarea{min-height:44px;padding:10px 12px;border-radius:var(--r-sm);border:1px solid var(--border-strong);background:var(--surface);color:var(--fg);font:400 1rem var(--body);width:100%}
.field textarea{min-height:88px;resize:vertical}
.field [aria-invalid="true"]{border-color:var(--danger);border-width:2px}
.err{color:var(--danger);font-size:.875rem;font-weight:700}
fieldset{border:0;padding:0;margin:0 0 16px}
.opt{display:flex;gap:12px;align-items:center;min-height:44px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--r-sm);margin-top:8px;cursor:pointer}
.opt:hover{background:var(--surface-2)}
.opt input{width:20px;height:20px;accent-color:var(--accent-btn);flex:none}
.overlay{position:fixed;inset:0;background:var(--overlay);display:grid;place-items:center;padding:16px;z-index:20;overflow-y:auto}
.modal{box-shadow:var(--shadow);background:var(--surface);border-radius:var(--r-lg);padding:24px;width:100%;max-width:480px;max-height:100%;overflow-y:auto;animation:pop .18s ease-out}
.modal h2{margin-bottom:8px} .modal .actions{margin-top:24px;border:0;padding:0;justify-content:flex-end}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;max-width:calc(100% - 32px)}
#toast div{background:var(--fg);color:var(--surface);padding:12px 20px;border-radius:var(--r-md);font-weight:700;animation:pop .18s ease-out}
.note{display:flex;gap:12px;padding:12px 16px;border-radius:var(--r-md);background:var(--accent-soft);color:var(--fg);font-size:.9375rem}
.note.coin-note{background:var(--coin-bg)}
.notif{display:grid;gap:2px;padding:12px 0;border-bottom:1px solid var(--border)}
.notif:last-child{border:0;padding-bottom:0}
.stack{display:grid;gap:16px}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-size:.8125rem;margin-left:4px}
.demo-bar{background:var(--fg);color:var(--bg);font:400 .8125rem var(--mono)}
.demo-bar div{max-width:1120px;margin:0 auto;padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.demo-bar button{background:none;border:1px solid currentColor;color:inherit;border-radius:999px;min-height:32px;padding:0 12px;font:500 .75rem var(--mono);cursor:pointer}
.demo-bar button:hover{background:rgba(127,127,127,.3)}

/* Guía al pie, paneles tipo vidrio */
.guide{position:relative;isolation:isolate;padding-top:0}
.guide::before{content:"";position:absolute;inset:48px 4% 48px;z-index:-1;filter:blur(36px);background:radial-gradient(circle at 12% 30%,var(--glow-1),transparent 45%),radial-gradient(circle at 88% 55%,var(--glow-1),transparent 42%),radial-gradient(circle at 50% 95%,var(--glow-2),transparent 50%)}
.guide-head{margin-bottom:24px;padding-top:32px;border-top:1px solid var(--border)}
.guide-head h2{font-size:1.5rem;font-weight:800;letter-spacing:-.03em;margin-top:4px}
.glass{position:relative;overflow:hidden;border-radius:24px;padding:24px;background:var(--glass-solid);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 -1px 0 var(--glass-b),var(--shadow)}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){.glass{background:linear-gradient(135deg,var(--glass-a),var(--glass-b));-webkit-backdrop-filter:blur(22px) saturate(1.7);backdrop-filter:blur(22px) saturate(1.7)}}
.glass::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(120% 80% at 0% 0%,var(--glass-hi),transparent 42%),linear-gradient(315deg,var(--glass-b),transparent 35%)}
.glass>*{position:relative}
.glass p,.guide-list{max-width:68ch}
.glass-label{font:500 .75rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 12px}
.glass-accent{border-color:var(--brand)}
.glass-wide{margin-top:16px}
.guide-list{display:grid;gap:8px}
.guide-list li{position:relative;padding-left:20px}
.guide-list li::before{content:"›";position:absolute;left:0;color:var(--accent);font-family:var(--mono)}
@media (max-width:420px){.roles{width:100%;order:3}.roles button{font-size:.875rem}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;transition:none!important}}
</style>
</head>

<script>
/* ============ Datos de ejemplo (todo es ficticio) ============ */
const ME = 'BL-4821';
const CLIENT = 'Distribuidora Andina S.A.S.';
const SLOTS = ['Miércoles 23 de septiembre, 9:00 a. m.','Miércoles 23 de septiembre, 3:00 p. m.','Jueves 24 de septiembre, 10:30 a. m.'];
const POOL = [
  ['Brayan Stiven Rojas','300 555 0142'],['Luz Dary Cardona','301 555 0187'],['Kevin Andrés Valencia','302 555 0111'],
  ['Paola Andrea Giraldo','310 555 0164'],['Wilmer Hurtado Caicedo','311 555 0129'],['Sandra Milena Zapata','312 555 0175'],
  ['Duván Esteban Mejía','313 555 0108'],['Yesica Tatiana Bedoya','314 555 0193'],['Óscar Iván Quintero','315 555 0156'],
  ['Natalia Andrea Ospina','316 555 0137'],['Cristian Camilo Arango','317 555 0119'],['Diana Marcela Lozano','318 555 0181']
];
const ZONES = {Bogotá:['Kennedy','Bosa','Fontibón','Engativá','Suba','Soacha'],Medellín:['Belén','Robledo','Bello','Itagüí','Aranjuez'],Cali:['Aguablanca','Siloé','Meléndez','Alfonso López'],Barranquilla:['Soledad','El Bosque','Las Nieves']};
const SUMMARIES = [
  'Experiencia estable en cargos similares, con permanencias de más de un año. Referencias laborales confirmadas.',
  'Perfil con buena disposición a turnos rotativos y fines de semana. Cuenta con curso certificado afín al cargo.',
  'Ha trabajado en empresas del mismo sector. Destaca en puntualidad y cumplimiento según sus referencias.',
  'Perfil junior con alto puntaje en pruebas. Busca estabilidad y vive cerca de la sede.'
];
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const between = (a,b) => Math.round(a + rnd() * (b - a));
const affinity = (s,t) => { const w = S.weights[t] || S.weights.logistica; return Math.round((s.exp*w.exp + s.comp*w.comp + s.disp*w.disp + s.cerca*w.cerca)/100); };
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cop = n => '$ ' + Math.round(n).toLocaleString('es-CO');

function genCands(n, city, top){
  const used = new Set(), out = [];
  for(let i=0;i<n;i++){
    let p; do { p = between(0, POOL.length-1); } while(used.has(p)); used.add(p);
    const z = ZONES[city] || ZONES.Bogotá, hi = top - i*between(4,7);
    out.push({code:'BL-'+between(1000,9899),name:POOL[p][0],phone:'+57 '+POOL[p][1],zone:z[between(0,z.length-1)],years:between(1,7),
      summary:SUMMARIES[i%SUMMARIES.length],
      scores:{exp:Math.min(98,hi+between(-4,4)),comp:Math.min(98,hi+between(-6,3)),disp:Math.min(99,hi+between(-3,6)),cerca:Math.min(97,hi+between(-10,4))},
      checks:{ant:rnd()>.25?'ok':'pendiente',prueba:between(70,93),ref:rnd()>.3},stage:'sugerido',backup:false,interview:null,confirmed:false});
  }
  return out;
}
function initialState(){
  seed = 7;

let toastTimer;
function toast(msg){ const t = document.getElementById('toast'); t.innerHTML = '<div>'+esc(msg)+'</div>'; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.innerHTML = '', 3200); }
let lastTrigger = null;
function openModal(html){
  lastTrigger = document.activeElement;
  const root = document.getElementById('modal-root');
  root.innerHTML = '<div class="overlay" data-a="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">'+html+'</div></div>';
  const f = root.querySelector('input,select,textarea,button'); if(f) f.focus();
}
function closeModal(){ document.getElementById('modal-root').innerHTML = ''; if(lastTrigger && document.contains(lastTrigger)) lastTrigger.focus(); }
document.addEventListener('keydown', e => {
  const m = document.querySelector('.modal'); if(!m) return;
  if(e.key === 'Escape'){ closeModal(); return; }
  if(e.key === 'Tab'){
    const f = [...m.querySelectorAll('button,input,select,textarea,a[href]')].filter(x => !x.disabled);
    if(!f.length) return;
    if(e.shiftKey && document.activeElement === f[0]){ e.preventDefault(); f[f.length-1].focus(); }
    else if(!e.shiftKey && document.activeElement === f[f.length-1]){ e.preventDefault(); f[0].focus(); }
  }
});

  'b-motor':{t:'Backoffice, motor de evaluación',
    hace:'Aquí se definen las reglas del producto: cuánto pesa cada dimensión en la afinidad según el tipo de cargo, desde qué puntaje una prueba cuenta como aprobada y a quién se le paga la consulta de antecedentes.',
    probar:['En Logística y bodega sube Competencias a 60, ajusta el resto para que sumen 100 y guarda. El ranking de Auxiliar de bodega se reordena.','Sube el puntaje mínimo a 90 y mira cómo cambian las etiquetas en el ranking.','Compara el costo mensual de las tres reglas de antecedentes.'],
    cubre:'Cubre la configuración por tipo de cargo con efecto inmediato en los rankings. Los costos son de ejemplo. No cubre el banco de pruebas ni el catálogo de cargos.',
    objetivo:'Decidir juntos la regla de antecedentes: define cuánta caja se gasta antes de facturar y qué promete exactamente la etiqueta que ve el cliente.'},
  'b-auto':{t:'Backoffice, automatizaciones',
    hace:'Muestra el estado de cada servicio automático (WhatsApp, transcripción, lectura de hojas de vida, pruebas, antecedentes, ranking), su costo y los errores técnicos que necesitan una acción.',
    probar:['Reintenta la consulta de BL-3307 y revisa en Empresa que su etiqueta pasa a «consultados, sin hallazgos».','Resuelve los otros errores y mira cómo queda la cola vacía.'],
    cubre:'El monitoreo es simulado. En el producto, estos datos vendrían de WhatsApp, del servicio de transcripción y del proveedor de antecedentes.',
    objetivo:'Mostrar que la operación es tecnológica: aquí se atienden fallos de sistemas y nadie aprueba ni rechaza personas.'},
  'b-casos':{t:'Backoffice, excepciones',
    hace:'Reúne los pocos casos que las reglas automáticas no pueden cerrar: un candidato que disputa un resultado, una alerta de fraude o una empresa que reclama un crédito.',
    probar:['Devuelve el crédito del reclamo y revisa el saldo y los movimientos en el rol Empresa.','Resuelve la disputa del homónimo y mira el registro que deja en Auditoría.'],
    cubre:'Son tres casos de ejemplo con dos salidas cada uno. No cubre la comunicación con el candidato ni los plazos legales de respuesta.',
    objetivo:'Dimensionar el mínimo de trabajo humano que el modelo necesita y definir quién lo haría durante el piloto.'},
  'b-empresas':{t:'Backoffice, empresas y vacantes',
    hace:'Administra el lado de los clientes: valida a las empresas nuevas antes de dejarlas revelar candidatos, retiene vacantes con requisitos no permitidos, lista los clientes activos y fija el precio del crédito.',
    probar:['Pide el documento que le falta a la empresa en alta.','Devuelve a la empresa la vacante que pide «mujer de 20 a 25 años».','Cambia el precio del crédito y mira los paquetes en el rol Empresa.'],
    cubre:'La validación y el filtro de vacantes son simulados. La consulta real del NIT y la detección automática de requisitos quedan para el producto.',
    objetivo:'Acordar qué le exigimos a una empresa para que pueda ver datos personales y qué vacantes no se aceptan en la plataforma.'},
  'b-audit':{t:'Backoffice, auditoría de accesos',
    hace:'Registra cada acceso a datos personales de un candidato: los de las empresas que revelan y también los del equipo interno.',
    probar:['Revela un candidato como Empresa o resuelve una excepción, y vuelve a esta página.'],
    cubre:'El registro vive en memoria y se borra al reiniciar la demo. En el producto sería permanente y no editable.',
    objetivo:'Mostrar que la protección de datos está en el diseño desde el inicio. Es una exigencia legal y también un argumento de venta frente a clientes grandes.'}
};
function guide(key){
  const g = GUIDE[key];
  const box = (label, inner, cls) => '<section class="glass '+(cls||'')+'"><h3 class="glass-label">'+label+'</h3>'+inner+'</section>';
  return '<footer class="wrap guide" aria-labelledby="guide-title"><div class="guide-head"><p class="glass-label">Guía de esta pantalla</p><h2 id="guide-title">'+g.t+'</h2></div><div class="grid c2">'+
    box('Qué hace esta página','<p>'+g.hace+'</p>')+
    box('Qué se espera probar','<ul class="guide-list">'+g.probar.map(x => '<li>'+x+'</li>').join('')+'</ul>')+
    box('Qué cubre y qué no','<p>'+g.cubre+'</p>')+
    box('Objetivo','<p>'+g.objetivo+'</p>','glass-accent')+
    '</div>'+box('Sobre esta demo','<p>Todos los datos son ficticios y nada se guarda: al recargar o tocar «Reiniciar demo» todo vuelve al inicio. Los tres roles comparten el mismo estado, así que lo que haces en uno se refleja en los otros. Mientras la recorres, anota dónde dudas, qué dato te falta y qué preguntaría un cliente. Esa lista define qué se construye primero.</p>','glass-wide')+'</footer>';
}

/* ============ Render ============ */
function render(){
  const roles = [['empresa','Empresa'],['candidato','Candidato'],['backoffice','Backoffice']].map(([k,l]) => '<button role="tab" data-a="role" data-r="'+k+'" aria-selected="'+(S.role===k)+'">'+l+'</button>').join('');
  const pill = S.role==='empresa' ? '<button class="pill num" data-a="eview" data-v="creditos" aria-label="'+S.credits+' créditos disponibles, ver detalle"><span class="coin" aria-hidden="true"></span>'+S.credits+(S.credits===1?' crédito':' créditos')+'</button>' : '';
  document.getElementById('app').innerHTML = '<div class="demo-bar"><div><span>Demo con datos ficticios. Cambia de rol para ver cómo una acción se refleja en las otras vistas.</span><button data-a="reset">Reiniciar demo</button></div></div>'+
    '<header class="top"><div class="top-in"><div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>Blinds</div><div class="roles" role="tablist" aria-label="Ver la demo como">'+roles+'</div>'+pill+'</div></header>'+
    (S.role==='empresa' ? viewEmpresa() : S.role==='candidato' ? viewCandidato() : viewBack());
}

/* ============ Acciones ============ */
const A = {
  role(d){ S.role = d.r; render(); window.scrollTo(0,0); },
  reset(){ S = initialState(); closeModal(); render(); toast('Demo reiniciada'); },
  eview(d){ S.view = d.v; S.vacId = null; render(); },
  cview(d){ S.cview = d.v; S.quizErr = false; render(); window.scrollTo(0,0); },
  openVac(d){ S.vacId = d.id; S.filter = 'todos'; render(); window.scrollTo(0,0); },
  backVac(){ S.vacId = null; render(); },
  filter(d){ S.filter = d.f; render(); },
  overlay(d, el, e){ if(e.target === el) closeModal(); },
  close(){ closeModal(); },
  askReveal(d){
    const {c,v} = findCand(d.code);
    if(S.credits < 1){ openModal('<h2 id="m-title">No tienes créditos</h2><p>Para revelar a este candidato necesitas 1 crédito. Tu ranking y tus vacantes siguen disponibles.</p><div class="actions"><button class="btn btn-ghost" data-a="close">Ahora no</button><button class="btn btn-primary" data-a="goBuy">Comprar créditos</button></div>'); return; }
    openModal('<h2 id="m-title">Revelar candidato '+c.code+'</h2><p>Vas a usar <b>1 crédito</b> de los '+S.credits+' que tienes. Verás su nombre, su celular y su hoja de vida completa, y le avisaremos que '+esc(CLIENT)+' está interesada.</p><p class="small muted" style="margin-top:12px">Afinidad con '+esc(v.title)+': '+affinity(c.scores,v.type)+'%.</p><div class="actions"><button class="btn btn-ghost" data-a="close">Cancelar</button><button class="btn btn-primary" data-a="reveal" data-code="'+c.code+'">Revelar candidato</button></div>');
  },
  goBuy(){ closeModal(); S.view = 'creditos'; S.vacId = null; render(); },
  reveal(d, el){
    if(el.disabled) return; el.disabled = true; el.textContent = 'Revelando…';
    setTimeout(() => {
      const {c,v} = findCand(d.code);
      S.credits--; c.stage = 'revelado'; c._opening = true;
      S.log.unshift({what:'Candidato revelado: '+c.code, vac:v.title, n:-1}); audit(CLIENT,'Reveló datos personales',c.code);
      if(c.code === ME) S.notifs.unshift({t:CLIENT+' reveló tu perfil para '+v.title+'. Pronto te pueden contactar.', d:'Ahora'});
      lastTrigger = null; closeModal(); render(); c._opening = false; toast('Candidato revelado');
    }, 650);
  },
  askInterview(d){
    openModal('<h2 id="m-title">Agendar entrevista</h2><p class="muted">El candidato recibe el aviso en su app y puede confirmar asistencia.</p><form id="int-form" data-code="'+d.code+'" novalidate><fieldset style="margin-top:16px"><legend class="sr">Horario de la entrevista</legend>'+SLOTS.map((s,i) => '<label class="opt"><input type="radio" name="slot" value="'+i+'" '+(i===0?'checked':'')+'><span>'+s+'</span></label>').join('')+'</fieldset><div class="actions"><button type="button" class="btn btn-ghost" data-a="close">Cancelar</button><button class="btn btn-primary" type="submit">Agendar entrevista</button></div></form>');
  },
  hire(d){ const {c,v} = findCand(d.code); c.stage = 'contratado'; c.backup = false; if(c.code===ME) S.notifs.unshift({t:'Felicitaciones: '+CLIENT+' te marcó como contratada en '+v.title+'.',d:'Ahora'}); render(); toast('Marcado como contratado'); },
  backup(d){ const {c} = findCand(d.code); c.backup = !c.backup; render(); toast(c.backup ? 'Quedó como candidato de respaldo' : 'Ya no es candidato de respaldo'); },
  discard(d){ const {c} = findCand(d.code); c.stage = 'descartado'; c.backup = false; render(); toast('Candidato descartado'); },
  confirmInt(d){ const c = findCandIn(d.id); c.confirmed = true; render(); toast('Asistencia confirmada'); },
  cityOnly(){ S.cityOnly = !S.cityOnly; render(); },
  apply(d){
    if(d.ext === '1'){ const m = S.market.find(x => x.id === d.id); if(m.applied) return; m.applied = true; S.notifs.unshift({t:'Te postulaste a '+m.title+'. Estamos evaluando tu afinidad.', d:'Ahora'}); }
    else {
      const v = vac(d.id); if(v.cands.some(c => c.code === ME)) return;
      const base = findCandIn('v1');
      v.cands.push({...base, scores:myFit(v), checks:base.checks, stage:'sugerido', backup:false, interview:null, confirmed:false, _opening:false});
      S.notifs.unshift({t:'Te postulaste a '+v.title+'. Ya estás en el ranking de '+CLIENT+'.', d:'Ahora'});
    }
    render(); toast('Postulación enviada');
  },
  buy(d){ const n = +d.n; S.credits += n; S.log.unshift({what:'Compra de '+n+' créditos (simulada)', vac:'', n}); render(); toast('Compraste '+n+' créditos'); },
  bview(d){ S.bview = d.v; render(); window.scrollTo(0,0); },
  fixErr(d){
    const e = S.errors.find(x => x.id === d.id); e.done = true;
    if(e.id === 'e1'){ const f = findCand('BL-3307'); if(f) f.c.checks.ant = 'ok'; audit('Sistema','Reconsulta automática de antecedentes','BL-3307'); toast('Consulta completada: sin hallazgos'); }
    else toast(e.id === 'e2' ? 'Se pidió un nuevo audio por WhatsApp' : 'Se envió la repregunta por WhatsApp');
    render();
  },
  resolveCase(d){
    const c = S.cases.find(x => x.id === d.id), o = +d.o; c.out = c.opts[o][1];
    if(c.id === 'c3' && o === 0){ S.credits++; S.log.unshift({what:'Crédito devuelto por reclamo (BL-5590)', vac:'', n:1}); }
    if(c.id === 'c1') audit('Laura M., operaciones','Vio datos personales para atender una disputa','BL-7720');
    if(c.id === 'c2') audit('Laura M., operaciones','Comparó datos de dos cuentas por alerta de fraude','BL-6415');
    render(); toast('Caso resuelto');
  },
  company(d){ S.company.state = d.o; render(); toast(d.o === 'pedir' ? 'Se pidió el documento a la empresa' : 'Solicitud rechazada'); },
  flagged(d){ S.flagged.state = d.o; render(); toast(d.o === 'devolver' ? 'Vacante devuelta a la empresa' : 'Vacante publicada'); },
  newVac(){
    openModal('<h2 id="m-title">Publicar vacante</h2><p class="muted" style="margin-bottom:16px">Con estos datos armamos el ranking de candidatos validados.</p><form id="vac-form" novalidate>'+
      '<div class="field"><label for="f-title">Cargo *</label><input id="f-title" name="title" autocomplete="off" maxlength="80"><span class="err" id="e-title" hidden></span></div>'+
      '<div class="field"><label for="f-type">Tipo de cargo</label><select id="f-type" name="type">'+Object.entries(BTYPES).map(([k,l]) => '<option value="'+k+'">'+l+'</option>').join('')+'</select></div>'+
      '<div class="field"><label for="f-city">Ciudad *</label><select id="f-city" name="city"><option value="">Elige una ciudad</option><option>Bogotá</option><option>Medellín</option><option>Cali</option><option>Barranquilla</option></select><span class="err" id="e-city" hidden></span></div>'+
      '<div class="field"><label for="f-open">Cupos *</label><input id="f-open" name="openings" inputmode="numeric" value="1"><span class="err" id="e-open" hidden></span></div>'+
      '<div class="field"><label for="f-sal">Salario ofrecido</label><input id="f-sal" name="salary" autocomplete="off" placeholder="Ejemplo: $ 1.750.000 más auxilio"></div>'+
      '<div class="field"><label for="f-shift">Turnos</label><input id="f-shift" name="shift" autocomplete="off" placeholder="Ejemplo: turnos rotativos"></div>'+
      '<p class="small muted">Los campos con * son obligatorios.</p><div class="actions"><button type="button" class="btn btn-ghost" data-a="close">Cancelar</button><button class="btn btn-primary" type="submit">Publicar vacante</button></div></form>');
  }
};
document.addEventListener('click', e => { const el = e.target.closest('[data-a]'); if(el && A[el.dataset.a]) A[el.dataset.a](el.dataset, el, e); });
document.addEventListener('submit', e => {
  e.preventDefault(); const f = e.target;
  const setErr = (id, inputId, msg) => { const s = document.getElementById(id), i = document.getElementById(inputId); s.hidden = !msg; s.textContent = msg ? '⚠ '+msg : ''; i.setAttribute('aria-invalid', msg ? 'true' : 'false'); return !msg; };
  if(f.id === 'vac-form'){
    const title = f.title.value.trim(), city = f.city.value, n = parseInt(f.openings.value, 10);
    const ok = [setErr('e-title','f-title', title ? '' : 'Escribe el cargo que necesitas cubrir.'), setErr('e-city','f-city', city ? '' : 'Elige la ciudad de la vacante.'), setErr('e-open','f-open', n >= 1 && n <= 500 ? '' : 'Escribe un número de cupos entre 1 y 500.')].every(Boolean);
    if(!ok){ f.querySelector('[aria-invalid="true"]').focus(); return; }
    const id = 'v'+Date.now(); const v = {id,type:f.type.value,title,city,salary:f.salary.value.trim()||'Salario a convenir',shift:f.shift.value.trim()||'Turno por definir',openings:n,cands:[],loading:true};
    S.vacancies.unshift(v); S.vacId = id; S.filter = 'todos'; lastTrigger = null; closeModal(); render(); toast('Vacante publicada'); window.scrollTo(0,0);
    setTimeout(() => { v.cands = genCands(between(3,5), city, between(84,93)); v.loading = false; if(S.vacId === id || S.role==='empresa') render(); }, 1600);
  }
  if(f.id === 'int-form'){
    const {c,v} = findCand(f.dataset.code); c.stage = 'entrevista'; c.interview = SLOTS[+f.slot.value]; c.confirmed = false;
    if(c.code === ME) S.notifs.unshift({t:'Tienes entrevista con '+CLIENT+': '+c.interview+'. Confirma tu asistencia.', d:'Ahora'});
    lastTrigger = null; closeModal(); render(); toast('Entrevista agendada');
  }
  if(f.id === 'quiz'){
    const done = [0,1,2].every(i => f['q'+i].value !== '');
    if(!done){ S.quizErr = true; const vals = [0,1,2].map(i => f['q'+i].value); render(); const nf = document.getElementById('quiz'); vals.forEach((val,i) => { if(val !== '') nf['q'+i].value = val; }); return; }
    S.testDone = true; S.quizErr = false; findCandIn('v1').checks.prueba = 88; myApps().forEach(av => { av.cands.find(x => x.code === ME).scores.comp = 90; });
    S.notifs.unshift({t:'Completaste la prueba de atención al detalle. Tu afinidad subió.', d:'Ahora'}); render(); toast('Prueba enviada');
  }
  if(f.id === 'w-form'){
    const vals = {}; let sum = 0, bad = false;
    DIMS.forEach(([k]) => { const n = parseInt(f[k].value, 10); if(!(n >= 0 && n <= 100)) bad = true; vals[k] = n; sum += n || 0; });
    const err = document.getElementById('w-err'), msg = bad ? 'Escribe un número entre 0 y 100 en cada dimensión.' : sum !== 100 ? 'Los cuatro pesos deben sumar 100. Ahora suman '+sum+'.' : '';
    err.hidden = !msg; err.textContent = msg ? '⚠ '+msg : ''; DIMS.forEach(([k]) => f[k].setAttribute('aria-invalid', msg ? 'true' : 'false'));
    if(msg) return;
    S.weights[S.wtype] = vals; render(); toast('Pesos guardados. Los rankings de '+BTYPES[S.wtype]+' se reordenaron');
  }
  if(f.id === 'th-form'){
    const n = parseInt(f.th.value, 10);
    if(!setErr('th-err','th', n >= 50 && n <= 95 ? '' : 'Escribe un puntaje entre 50 y 95.')) return;
    S.threshold = n; render(); toast('Puntaje mínimo guardado');
  }
  if(f.id === 'price-form'){
    const n = parseInt(String(f.price.value).replace(/\D/g,''), 10);
    if(!setErr('price-err','price', n >= 1000 ? '' : 'Escribe un valor de al menos $ 1.000.')) return;
    S.price = n; render(); toast('Precio guardado');
  }
});
document.addEventListener('change', e => {
  const c = e.target.dataset.c;
  if(c === 'wtype'){ S.wtype = e.target.value; render(); document.getElementById('wtype').focus(); }
  if(c === 'vrule'){ S.vrule = e.target.value; render(); toast('Regla de consulta guardada'); }
});
render();
</script>
