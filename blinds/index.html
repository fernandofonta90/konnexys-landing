<style>
:root{--bg:#F7F3EE;--fg:#121210;--muted:#5A554E;--line:#EADDD2;--accent:#CC4A18;--danger:#B3261E}
@media(prefers-color-scheme:dark){:root{--bg:#171310;--fg:#F3ECE6;--muted:#B8ADA3;--line:#3A302A;--accent:#FF9466;--danger:#FF8A80}}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;font:400 16px/1.5 Geist,system-ui,sans-serif;color:var(--fg);background:radial-gradient(60rem 40rem at -5% -10%,rgba(248,150,110,.45),transparent 60%),radial-gradient(50rem 36rem at 105% 110%,rgba(250,190,160,.4),transparent 60%),var(--bg)}
form{width:100%;max-width:380px;display:grid;gap:12px}
h1{font-weight:800;letter-spacing:-.03em;font-size:1.75rem;margin:0}
p{margin:0;color:var(--muted)}
label{font-weight:600}
input{min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:transparent;color:inherit}
button{min-height:44px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:600 1rem Geist,system-ui,sans-serif;cursor:pointer}
@media(prefers-color-scheme:dark){button{color:#1A1512}}
button[disabled]{opacity:.6;cursor:not-allowed}
.err{color:var(--danger);font-weight:600;min-height:1.5em}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style></head><body>

</form>

async function open(key){const t=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},key,u(D.c));document.open();document.write(new TextDecoder().decode(t));document.close();}
window.addEventListener('load',async()=>{try{const k=sessionStorage.getItem('blinds-k');if(k){await open(await crypto.subtle.importKey('raw',u(k),'AES-GCM',false,['decrypt']));}}catch(_){}});
if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('/blinds/sw.js',{scope:'/blinds/'}).catch(()=>{});}
document.getElementById('f').addEventListener('submit',async ev=>{ev.preventDefault();const b=document.getElementById('b'),e=document.getElementById('e'),p=document.getElementById('p');
e.textContent='';b.disabled=true;b.textContent='Verificando…';
try{const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(p.value),'PBKDF2',false,['deriveKey']);
const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:300000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['decrypt']);
try{sessionStorage.setItem('blinds-k',btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw',key)))));}catch(_){}
await open(key);}catch(_){e.textContent='Contraseña incorrecta. Revísala y vuelve a intentar.';b.disabled=false;b.textContent='Entrar';p.select();}});
